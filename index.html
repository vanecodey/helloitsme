<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Photo Archive</title>

  <!-- Optional web font. If it is blocked or offline, the system fallback stack is used. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    /* ------------------------------------------------------------------
       Design tokens — change the look of the whole site from here.
       ------------------------------------------------------------------ */
    :root {
      --bg:        #22252a;   /* page background (dark slate)            */
      --bg-deep:   #1a1c20;   /* header, lightbox                        */
      --surface:   #2c3036;   /* placeholders, tiles, buttons            */
      --line:      #3a3f47;   /* hairlines                               */
      --text:      #e9ebee;
      --text-dim:  #9ca3ad;
      --accent:    #7fb0e0;   /* links, focus ring                       */

      --radius:    6px;
      --gap:       16px;
      --header-h:  56px;
      --font: "Barlow", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-padding-top: calc(var(--header-h) + 16px); }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 400 1rem/1.5 var(--font);
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; color: inherit; cursor: pointer; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    /* ---------------------------- Header ---------------------------- */
    .site-header {
      position: sticky; top: 0; z-index: 10;
      height: var(--header-h);
      background: var(--bg-deep);
      border-bottom: 1px solid var(--line);
    }
    .site-header__inner {
      height: 100%;
      max-width: 1280px; margin: 0 auto; padding: 0 20px;
      display: flex; align-items: center;
    }
    .crumbs {
      list-style: none; margin: 0; padding: 0;
      display: flex; align-items: center; gap: 4px;
      overflow-x: auto; white-space: nowrap;
      scrollbar-width: none;                 /* long trails scroll on phones */
    }
    .crumbs::-webkit-scrollbar { display: none; }
    .crumbs li { display: flex; align-items: center; gap: 4px; }
    .crumbs li + li::before {
      content: ""; width: 6px; height: 6px; margin: 0 6px;
      border-top: 1.5px solid var(--text-dim); border-right: 1.5px solid var(--text-dim);
      transform: rotate(45deg);
    }
    .crumbs a { padding: 6px 4px; color: var(--text-dim); border-radius: 4px; }
    .crumbs a:hover { color: var(--text); }
    .crumbs [aria-current="page"] { padding: 6px 4px; font-weight: 600; }

    /* ----------------------------- Main ----------------------------- */
    main { max-width: 1280px; margin: 0 auto; padding: 28px 20px 72px; }
    .page-title { margin: 0; font-size: clamp(1.5rem, 1.1rem + 1.6vw, 2.1rem); font-weight: 600; line-height: 1.2; }
    .page-meta  { margin: 4px 0 24px; color: var(--text-dim); }
    .section-title { margin: 36px 0 12px; font-size: 1.05rem; font-weight: 600; color: var(--text-dim); }

    /* Folder grid: 3 columns desktop, 2 tablet, 1 mobile */
    .folder-grid {
      display: grid; gap: var(--gap);
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }
    @media (max-width: 960px) { .folder-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 560px) { .folder-grid { grid-template-columns: 1fr; } }

    /* ------------------------- Folder card -------------------------- */
    .card {
      position: relative; display: block; overflow: hidden;
      aspect-ratio: 16 / 10;
      background: var(--surface);
      border-radius: var(--radius);
      isolation: isolate;
    }
    .card__img {
      position: absolute; inset: 0; z-index: -2;
      width: 100%; height: 100%; object-fit: cover;
      transition: transform .35s ease;
    }
    .card:hover .card__img, .card:focus-visible .card__img { transform: scale(1.04); }
    .card__label {
      position: absolute; left: 0; right: 0; bottom: 0;
      display: flex; align-items: center; gap: 10px;
      padding: 40px 16px 14px;
      /* semi-transparent dark gradient behind the title */
      background: linear-gradient(to top, rgba(16,18,21,.90) 0%, rgba(16,18,21,.55) 55%, rgba(16,18,21,0) 100%);
    }
    .card__icon { flex: none; width: 20px; height: 20px; color: var(--text); opacity: .85; }
    .card__title { font-weight: 600; font-size: 1.05rem; line-height: 1.25; }
    .card__count { margin-left: auto; flex: none; font-size: .85rem; color: var(--text-dim); }

    /* ------------------------- Photo grid --------------------------- */
    .photo-grid {
      display: grid; gap: 8px;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    }
    .photo {
      padding: 0; border: 0; border-radius: 4px; overflow: hidden;
      aspect-ratio: 4 / 3; background: var(--surface);
    }
    .photo img { width: 100%; height: 100%; object-fit: cover; display: block; transition: opacity .2s; }
    .photo:hover img { opacity: .85; }

    /* ---------------------- Empty / error states -------------------- */
    .notice {
      max-width: 60ch; padding: 20px 22px;
      background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    }
    .notice h2 { margin: 0 0 6px; font-size: 1.1rem; }
    .notice p  { margin: 6px 0; color: var(--text-dim); }
    .notice code { padding: 1px 6px; background: var(--bg-deep); border-radius: 4px; color: var(--text); font-size: .9em; }

    /* ---------------------------- Lightbox -------------------------- */
    dialog.lightbox {
      width: 100vw; height: 100vh; max-width: none; max-height: none;
      margin: 0; padding: 0; border: 0;
      background: rgba(12,13,15,.96); color: var(--text);
    }
    dialog.lightbox[open] { display: grid; grid-template-rows: 1fr auto; }
    dialog.lightbox::backdrop { background: rgba(0,0,0,.8); }
    .lb__stage { position: relative; display: flex; align-items: center; justify-content: center; min-height: 0; padding: 56px 64px 8px; }
    .lb__img { max-width: 100%; max-height: 100%; object-fit: contain; user-select: none; }
    .lb__bar {
      display: flex; align-items: center; gap: 16px;
      padding: 12px 20px 16px; font-size: .95rem;
    }
    .lb__caption { flex: 1; min-width: 0; }
    .lb__count, .lb__open { color: var(--text-dim); flex: none; }
    .lb__open:hover { color: var(--text); }
    .lb__btn {
      position: absolute; display: grid; place-items: center;
      width: 44px; height: 44px; border: 0; border-radius: 50%;
      background: rgba(255,255,255,.08);
    }
    .lb__btn:hover { background: rgba(255,255,255,.18); }
    .lb__btn svg { width: 22px; height: 22px; }
    .lb__close { top: 10px; right: 12px; }
    .lb__prev  { left: 10px;  top: 50%; transform: translateY(-50%); }
    .lb__next  { right: 10px; top: 50%; transform: translateY(-50%); }
    @media (max-width: 640px) {
      .lb__stage { padding: 56px 8px 8px; }
      .lb__prev, .lb__next { top: auto; bottom: 64px; transform: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  </style>
</head>

<body>
  <header class="site-header">
    <div class="site-header__inner">
      <nav aria-label="Breadcrumb">
        <ol class="crumbs" id="crumbs"></ol>
      </nav>
    </div>
  </header>

  <!-- app.js renders folders / photos into this element -->
  <main id="app" aria-live="polite">
    <p class="page-meta">Loading…</p>
  </main>

  <!-- Lightbox: native <dialog> gives us focus trapping and Esc-to-close for free -->
  <dialog class="lightbox" id="lightbox" aria-label="Photo viewer">
    <div class="lb__stage" id="lb-stage">
      <button class="lb__btn lb__close" id="lb-close" aria-label="Close viewer">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
      <button class="lb__btn lb__prev" id="lb-prev" aria-label="Previous photo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <img class="lb__img" id="lb-img" alt="">
      <button class="lb__btn lb__next" id="lb-next" aria-label="Next photo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
      </button>
    </div>
    <div class="lb__bar">
      <span class="lb__caption" id="lb-caption"></span>
      <span class="lb__count" id="lb-count"></span>
      <a class="lb__open" id="lb-open" target="_blank" rel="noopener">Open original</a>
    </div>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
